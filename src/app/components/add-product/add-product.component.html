<div class="product-form-container">
  <header>
    <h2 class="form-title text-primary mb-0">Add Product</h2>
    <h3 class="form-subtitle mb-3">Product 1</h3>
  </header>
  
  <form #productForm="ngForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="form-grid">
      <!-- Basic Product Details -->
      <div class="form-group">
        <label for="hsnCode">HSN Code*</label>
        <select id="hsnCode" [(ngModel)]="product.hsnCode" name="hsnCode" required>
          <option value="">Select HSN Code</option>
          <option value="code1">Code 1</option>
          <option value="code2">Code 2</option>
        </select>
        <div class="invalid-feedback" *ngIf="productForm.submitted && productForm.form.get('hsnCode')?.errors?.['required']">
          HSN Code is required
        </div>
      </div>

      <div class="form-group">
        <label for="masterProduct">Master Product*</label>
        <input type="text" id="masterProduct" [(ngModel)]="product.masterProduct" 
               name="masterProduct" placeholder="Enter product name" 
               class="form-control gray-bg" required>
      </div>

      <!-- Product Classification -->
      <div class="form-group">
        <label for="category">Category*</label>
        <input type="text" id="category" [(ngModel)]="product.category" 
               name="category" placeholder="Enter category" required>
      </div>
      
      <div class="form-group">
        <label for="uom">Unit of Measurement</label>
        <select id="uom" [(ngModel)]="product.uom" name="uom" class="form-control">
          <option value="">Select UOM</option>
          <option value="kg">Kilogram</option>
          <option value="liter">Liter</option>
          <option value="piece">Piece</option>
        </select>
      </div>

      <!-- Pricing Details -->
      <div class="form-group">
        <label for="unitPrice">Unit Price*</label>
        <input type="number" id="unitPrice" [(ngModel)]="product.unitPrice" 
               name="unitPrice" placeholder="0.00" min="0" required>
      </div>

      <div class="form-group">
        <label for="landingChargesPercent">Landing Charges (%)</label>
        <input type="number" id="landingChargesPercent" 
               [(ngModel)]="product.landingChargesPercent" 
               name="landingChargesPercent" placeholder="0.00" min="0">
      </div>

      <!-- Calculated Fields -->
      <div class="form-group">
        <label for="costOfProduct">Cost of Product</label>
        <input type="number" id="costOfProduct" [(ngModel)]="product.costOfProduct" 
               name="costOfProduct" [readonly]="true" class="form-control-plaintext">
      </div>

      <!-- GST Information -->
      <div class="form-group">
        <label for="gstApplicable">GST Applicable</label>
        <select id="gstApplicable" [(ngModel)]="product.gstApplicable" 
                name="gstApplicable" class="form-control">
          <option value="">Select</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </div>

      <!-- Stock Management -->
      <div class="form-group">
        <label for="currentQuantity">Current Stock*</label>
        <input type="number" id="currentQuantity" [(ngModel)]="product.currentQuantity" 
               name="currentQuantity" placeholder="0" min="0" required>
      </div>

      <div class="form-group">
        <label for="thresholdQuantity">Threshold Quantity</label>
        <input type="number" id="thresholdQuantity" 
               [(ngModel)]="product.thresholdQuantity" 
               name="thresholdQuantity" placeholder="0" min="0">
      </div>
    </div>

    <!-- Image Upload Section -->
    <div class="images-section mt-4">
      <label class="section-label">Product Images</label>
      <div class="image-upload-container">
        <div class="upload-zone" *ngIf="!imagePreviewUrl">
          <input type="file" #fileInput hidden (change)="onImageSelected($event)" 
                 accept="image/*">
          <button type="button" class="btn btn-outline-primary" 
                  (click)="fileInput.click()">
            Choose Image
          </button>
          <p class="text-muted mt-2">Supported formats: JPG, PNG (Max 5MB)</p>
        </div>
        <div class="preview-zone" *ngIf="imagePreviewUrl">
          <img [src]="imagePreviewUrl" alt="Product preview" class="img-preview">
          <button type="button" class="btn btn-danger mt-2" 
                  (click)="removeImage()">Remove</button>
        </div>
      </div>
    </div>

    <!-- Sub Products Section -->
    <div class="sub-products-section mt-4" *ngIf="showSubProducts">
      <h4>Sub Products</h4>
      <table class="table table-bordered">
        <thead class="thead-light">
          <tr>
            <th scope="col" width="5%">#</th>
            <th scope="col" width="40%">Sub Material Name</th>
            <th scope="col" width="40%">Description</th>
            <th scope="col" width="15%">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of subProducts; let i = index">
            <td>{{i + 1}}</td>
            <td>
              <input type="text" [(ngModel)]="item.materialName" 
                     [name]="'materialName' + i" class="form-control"
                     placeholder="Enter material name" required>
            </td>
            <td>
              <input type="text" [(ngModel)]="item.description" 
                     [name]="'description' + i" class="form-control"
                     placeholder="Enter description">
            </td>
            <td>
              <button type="button" class="btn btn-danger btn-sm" 
                      (click)="deleteSubProduct(item.id)">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>

      <button type="button" class="btn btn-outline-primary" 
              (click)="addNewSubProduct()">
        Add New Sub Product <i class="fas fa-plus"></i>
      </button>
    </div>

    <!-- Form Actions -->
    <div class="form-actions mt-4">
      <button type="button" class="btn btn-secondary me-2" 
              (click)="onReset()">Reset</button>
      <button type="submit" class="btn btn-primary" 
              [disabled]="!productForm.form.valid">Save Product</button>
    </div>
  </form>
</div>
